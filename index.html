<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Simple Password Generator</title>
    <link rel="icon" type="image/x-icon" href="quince.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Quence password generator</h1>

    <p>
        Quence makes short, memorable, high-entropy passwords.
    </p>

    <div id="generator">
        <button id="generate" onclick="generatePassword()" disabled>
            Generate
        </button>
        <input type="text" id="password" readonly>
        <button id="copy" onclick="copyToClipboard()" disabled>
            Copy
        </button>
    </div>

    <script src="script.js"></script>
</body>

</html>
